# Stage 1: Basic file cleanup (no Python syntax checking yet)
# Run this first to fix basic file formatting issues
repos:
  # Fix basic file formatting issues
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "Remove trailing whitespace"
      - id: end-of-file-fixer
        name: "Fix file endings"
      - id: check-yaml
        name: "Validate YAML syntax"
      - id: check-added-large-files
        name: "Check for large files"
        args: [--maxkb=500]
      - id: check-merge-conflict
        name: "Check for merge conflicts"

  # YAML formatting validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        name: "Lint YAML files"
        args: [-d, relaxed]
        files: \.(yaml|yml)$

  # Clean Python cache files before commit
  - repo: local
    hooks:
      - id: clean-python-cache
        name: "Clean Python cache files"
        entry: bash -c 'find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true; find . -name "*.pyc" -delete 2>/dev/null || true; find . -name "*.pyo" -delete 2>/dev/null || true; echo "🧹 Python cache cleaned"'
        language: system
        pass_filenames: false
        always_run: false
        files: \.py$

  # Stage 2: Python code formatting
  # Format Python code with Black
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        name: "Format Python code with Black"
        language_version: python3
        args: [--line-length=88]

  # Remove unused imports and variables
  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        name: "Remove unused imports and variables"
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --remove-duplicate-keys
          - --ignore-init-module-imports

  # Sort and organize imports
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: "Sort Python imports"
        args: ["--profile", "black", "--filter-files"]

