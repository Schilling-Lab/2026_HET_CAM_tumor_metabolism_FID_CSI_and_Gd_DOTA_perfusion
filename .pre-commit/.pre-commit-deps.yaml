# Pre-commit configuration for dependency validation
# Run with: pre-commit run --config .pre-commit-deps.yaml --all-files

repos:
  - repo: local
    hooks:
      - id: validate-dependencies
        name: Validate Dependencies
        entry: python scripts/hooks/validate_dependencies.py
        language: system
        always_run: true
        pass_filenames: false
        description: Check that all imports are declared in pyproject.toml
        stages: [pre-commit]
