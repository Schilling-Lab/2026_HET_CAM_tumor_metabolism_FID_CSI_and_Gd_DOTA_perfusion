# Stage 3: Full linting and validation (run after formatting)
repos:
  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-requests]
        args: [--ignore-missing-imports, --namespace-packages]
        exclude: ^(docs/|tests/test_.*\.py|scripts/hooks/)

  # Linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503,F541,F401,E501"]
        exclude: ^(scripts/hooks/)

  # Docstring validation with pydocstyle
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--convention=google, --add-ignore=D100,D104,D107,D212]
        exclude: ^(tests/|examples/|scripts/hooks/)

  # Security linting with bandit
  - repo: https://github.com/pycqa/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-r, -f, json, --skip, B110]
        exclude: ^(tests/|scripts/hooks/)

  # Custom HyperMRI standards validation
  - repo: local
    hooks:
      - id: hypermri-naming-conventions
        name: HyperMRI Naming Conventions
        entry: python scripts/hooks/validate_naming.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)

      - id: hypermri-docstring-standards
        name: HyperMRI Docstring Standards
        entry: python scripts/hooks/validate_docstrings.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)

      - id: hypermri-type-hints
        name: HyperMRI Type Hints
        entry: python scripts/hooks/validate_type_hints.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)

      - id: hypermri-import-standards
        name: HyperMRI Import Standards
        entry: python scripts/hooks/validate_imports.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)

      - id: hypermri-registry-compliance
        name: HyperMRI Registry Compliance
        entry: python scripts/hooks/validate_registry_compliance.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)
