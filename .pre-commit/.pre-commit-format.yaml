# Stage 2: Python code formatting (run after Stage 1 passes)
# This stage formats Python code and fixes basic syntax issues
repos:
  # Format Python code with Black
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        name: "Format Python code with Black"
        description: "Automatically formats Python code to consistent style"
        language_version: python3
        args: [--line-length=88]

  # Remove unused imports and variables
  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        name: "Remove unused imports and variables"
        description: "Removes unused imports and variables from Python files"
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --remove-duplicate-keys
          - --ignore-init-module-imports

  # Sort and organize imports
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: "Sort Python imports"
        description: "Sorts and organizes Python imports consistently"
        args: ["--profile", "black", "--filter-files"]
