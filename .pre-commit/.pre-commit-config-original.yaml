# Pre-commit hooks for HyperMRI code standards
# Install with: pip install pre-commit && pre-commit install

repos:
  # Built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: requirements-txt-fixer

  # Python formatting with black
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]

  # Remove unused imports with autoflake
  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --remove-duplicate-keys
          - --ignore-init-module-imports


  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-requests]
        args: [--ignore-missing-imports, --namespace-packages]
        exclude: ^(docs/|tests/test_.*\.py|scripts/hooks/)

  # Linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503,F541,F401,E501"]
        exclude: ^(scripts/hooks/)

  # Docstring validation with pydocstyle
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--convention=google, --add-ignore=D100,D104,D107,D212]
        exclude: ^(tests/|examples/|scripts/hooks/)

  # Security linting with bandit
  - repo: https://github.com/pycqa/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-r, -f, json, --skip, B110]
        exclude: ^(tests/|scripts/hooks/)

  # Custom HyperMRI standards validation
  - repo: local
    hooks:
      - id: hypermri-naming-conventions
        name: HyperMRI Naming Conventions
        entry: python scripts/hooks/validate_naming.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)

      - id: hypermri-docstring-standards
        name: HyperMRI Docstring Standards
        entry: python scripts/hooks/validate_docstrings.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)

      - id: hypermri-type-hints
        name: HyperMRI Type Hints
        entry: python scripts/hooks/validate_type_hints.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)

      - id: hypermri-import-standards
        name: HyperMRI Import Standards
        entry: python scripts/hooks/validate_imports.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)

      - id: hypermri-registry-compliance
        name: HyperMRI Registry Compliance
        entry: python scripts/hooks/validate_registry_compliance.py
        language: python
        files: \.py$
        exclude: ^(tests/|examples/|docs/|scripts/hooks/)

  # YAML validation for configs
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-d, relaxed]
        files: \.(yaml|yml)$
