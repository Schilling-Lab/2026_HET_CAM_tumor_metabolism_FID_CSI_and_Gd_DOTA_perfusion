[tox]
minversion = 4.1.2
envlist =
    format
    deps
    python3.10
isolated_build = true

[gh-actions]
python =
    3.10: format, deps, python3.10

[testenv]
description = install package with [dev] extras in a virtual environment and invoke pytest
setenv =
    PYTHONPATH = {toxinidir}
extras = dev
commands =
    pytest --basetemp={envtmpdir}


[testenv:format]
description = install black in a virtual environment and invoke it on the current folder
deps = black==25.1.0
skip_install = true
commands = black --line-length=88 .

[testenv:deps]
description = check that all package imports are declared in pyproject.toml dependencies
deps =
    tomli>=1.2.0
skip_install = true
commands =
    python {toxinidir}/scripts/hooks/validate_dependencies.py
